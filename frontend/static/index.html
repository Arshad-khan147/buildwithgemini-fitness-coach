<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" id="theme-color-meta" content="#059669">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NovaSmart Fitness Coach</title>

<!-- Favicon & PWA Manifest -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.json">

<!-- Google Fonts: Plus Jakarta Sans & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Leaflet CSS for Gym Finder Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  :root {
    --accent: #059669;
    --accent-light: #10b981;
    --accent-dark: #047857;
    --accent-glow: rgba(16, 185, 129, 0.18);
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --pill-bg: #ffffff;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 16px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 25px -5px rgba(5, 150, 105, 0.2);
  }

  [data-theme="dark"] {
    --accent: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(52, 211, 153, 0.22);
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #64748b;
    --border: #334155;
    --pill-bg: #1e293b;
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 16px -2px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html { height: 100vh; height: 100dvh; }
  body {
    margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg-main); color: var(--text-primary); display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; min-height: -webkit-fill-available; overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* --- MODAL BACKDROPS --- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .modal-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 1.75rem;
    width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); text-align: left;
    max-height: 90vh; overflow-y: auto; animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
  .modal-title { font-size: 1.25rem; font-weight: 800; color: var(--text-primary); margin: 0; display: flex; align-items: center; gap: 0.5rem; }
  .close-icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; }

  /* --- AUTH OVERLAY --- */
  .auth-logo {
    width: 60px; height: 60px; background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    color: #ffffff; border-radius: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 2rem; margin: 0 auto 1rem; box-shadow: var(--shadow-lg);
  }
  .auth-title { font-size: 1.4rem; font-weight: 800; margin: 0 0 0.3rem; color: var(--text-primary); text-align: center; }
  .auth-subtitle { font-size: 0.88rem; color: var(--text-secondary); margin: 0 0 1.5rem; text-align: center; }
  .auth-tabs { display: flex; background: var(--bg-main); border-radius: 14px; padding: 4px; margin-bottom: 1.25rem; border: 1px solid var(--border); }
  .auth-tab { flex: 1; border: none; background: transparent; padding: 0.6rem; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
  .auth-tab.active { background: var(--bg-card); color: var(--accent); box-shadow: var(--shadow-sm); }
  .auth-form { display: flex; flex-direction: column; gap: 0.9rem; text-align: left; }
  .input-field-group { display: flex; flex-direction: column; gap: 0.35rem; }
  .input-field-group label { font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
  .auth-input, .settings-select {
    width: 100%; padding: 0.8rem 1rem; border: 1.5px solid var(--border); border-radius: 14px; font-size: 0.95rem;
    background: var(--bg-main); color: var(--text-primary); outline: none; transition: all 0.2s ease; font-family: inherit;
  }
  .auth-input:focus, .settings-select:focus { border-color: var(--accent); background: var(--bg-card); box-shadow: 0 0 0 4px var(--accent-glow); }
  .auth-submit-btn, .action-submit-btn {
    width: 100%; padding: 0.85rem; border: none; border-radius: 14px; background: linear-gradient(135deg, #059669 0%, #10b981 100%);
    color: #ffffff; font-size: 0.95rem; font-weight: 700; cursor: pointer; box-shadow: var(--shadow-lg); transition: transform 0.15s ease; margin-top: 0.3rem;
  }
  .auth-submit-btn:active, .action-submit-btn:active { transform: scale(0.98); }
  .guest-divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.15rem 0; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; }
  .guest-divider::before, .guest-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .guest-btn { width: 100%; padding: 0.75rem; border: 1.5px dashed var(--accent); border-radius: 14px; background: var(--accent-glow); color: var(--accent); font-size: 0.88rem; font-weight: 700; cursor: pointer; }

  /* --- HEADER & STATS --- */
  header {
    background: linear-gradient(135deg, #064e3b 0%, #059669 100%); color: #ffffff;
    padding: max(0.8rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) 0.8rem max(1.25rem, env(safe-area-inset-left));
    display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(5, 150, 105, 0.2); z-index: 10; flex-shrink: 0;
  }
  .header-brand { display: flex; align-items: center; gap: 0.75rem; min-width: 0; cursor: pointer; transition: transform 0.15s ease; }
  .header-brand:active { transform: scale(0.97); }
  .brand-icon { width: 40px; height: 40px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; flex-shrink: 0; }
  .brand-text { min-width: 0; }
  .brand-title { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; margin: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-subtitle { font-size: 0.75rem; color: rgba(255, 255, 255, 0.85); font-weight: 500; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; align-items: center; gap: 0.45rem; flex-shrink: 0; }
  .user-badge { display: flex; align-items: center; gap: 0.4rem; background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(8px); padding: 0.3rem 0.65rem; border-radius: 20px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .header-icon-btn { background: rgba(255, 255, 255, 0.15); border: none; color: #ffffff; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
  .header-icon-btn:active { background: rgba(255, 255, 255, 0.35); transform: scale(0.95); }
  .header-icon-btn .material-symbols-outlined { font-size: 1.2rem; color: #ffffff; }

  .quick-stats-bar {
    background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0.45rem 1rem;
    display: flex; align-items: center; justify-content: space-around; font-size: 0.78rem; font-weight: 600;
    color: var(--text-secondary); flex-shrink: 0; cursor: pointer; flex-wrap: wrap; gap: 0.5rem;
  }
  .stat-item { display: flex; align-items: center; gap: 0.35rem; }
  .stat-item strong { color: var(--accent); }

  /* --- LOG & MESSAGES --- */
  #log { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 1.25rem 1rem; max-width: 840px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; scroll-behavior: smooth; }
  .welcome-hero { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem 1.25rem; text-align: center; box-shadow: var(--shadow-md); margin-bottom: 0.5rem; }
  .welcome-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.65rem; margin: 0 auto 0.85rem; box-shadow: var(--shadow-lg); }
  .welcome-hero h2 { margin: 0 0 0.4rem; font-size: 1.25rem; font-weight: 800; color: var(--text-primary); }
  .welcome-hero p { margin: 0 0 1.15rem; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; }
  .welcome-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; text-align: left; }
  .feature-card { background: var(--bg-main); border: 1px solid var(--border); border-radius: 14px; padding: 0.85rem 0.9rem; cursor: pointer; transition: all 0.2s ease; min-height: 48px; }
  .feature-card:active { border-color: var(--accent); transform: scale(0.98); background: var(--accent-glow); }
  .feature-card-title { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.35rem; }
  .feature-card-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }

  .msg-row { display: flex; gap: 0.65rem; align-items: flex-start; width: 100%; animation: fadeIn 0.3s ease-out forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; box-shadow: var(--shadow-sm); }
  .msg-row.agent .avatar { background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; }
  .msg-row.user .avatar { background: var(--border); color: var(--text-secondary); }
  .msg-content { display: flex; flex-direction: column; max-width: 88%; gap: 0.35rem; }
  .msg-row.user .msg-content { align-items: flex-end; }
  .bubble { padding: 0.85rem 1.1rem; border-radius: 18px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); font-size: 0.95rem; line-height: 1.5; box-shadow: var(--shadow-sm); white-space: pre-wrap; word-break: break-word; }
  .msg-row.agent .bubble { border-top-left-radius: 4px; }
  .msg-row.user .bubble { background: linear-gradient(135deg, #059669 0%, #047857 100%); color: #ffffff; border: none; border-top-right-radius: 4px; box-shadow: var(--shadow-lg); }

  .msg-actions { display: flex; gap: 0.4rem; align-self: flex-start; flex-wrap: wrap; }
  .msg-action-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); border-radius: 12px; padding: 0.25rem 0.55rem; font-size: 0.72rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.25rem; transition: all 0.2s ease; }
  .msg-action-btn:active { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }
  .msg-action-btn .material-symbols-outlined { font-size: 0.95rem; }

  /* --- CARDS & WIDGETS --- */
  .timer-widget, .macro-card, .hr-zone-card, .gym-map-card, .bmi-card, .sub-card, .water-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 1.1rem; margin-top: 0.5rem; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 0.85rem;
  }
  .timer-display { font-size: 2rem; font-weight: 800; color: var(--accent); font-family: monospace; letter-spacing: 0.05em; text-align: center; }
  .timer-controls { display: flex; gap: 0.5rem; justify-content: center; }
  .timer-btn { border: none; background: var(--accent); color: #ffffff; padding: 0.45rem 0.9rem; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }

  .macro-slider-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .macro-slider-header { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); }
  .macro-slider { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .macro-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; background: var(--bg-main); padding: 0.65rem; border-radius: 12px; border: 1px solid var(--border); }
  .macro-box-val { font-weight: 800; font-size: 1rem; color: var(--accent-dark); }
  .macro-box-lbl { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }

  /* HR 5-Zone Spectrum Bar */
  .zone-spectrum { display: flex; flex-direction: column; gap: 0.4rem; }
  .zone-row { display: flex; align-items: center; justify-content: space-between; padding: 0.4rem 0.65rem; border-radius: 10px; font-size: 0.78rem; font-weight: 700; color: #ffffff; }
  .z1 { background: #3b82f6; } .z2 { background: #10b981; } .z3 { background: #eab308; } .z4 { background: #f97316; } .z5 { background: #ef4444; }

  /* Hydration Progress Bar */
  .water-progress-bg { width: 100%; height: 16px; background: var(--bg-main); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .water-progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%); width: 0%; transition: width 0.3s ease; }

  /* Map Container */
  #map-element { height: 220px; width: 100%; border-radius: 12px; border: 1px solid var(--border); }

  /* --- LIGHTBOX MODAL --- */
  #lightbox-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
  #lightbox-modal.active { opacity: 1; visibility: visible; }
  .lightbox-content { max-width: 90vw; max-height: 80vh; border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); overflow: hidden; }
  .lightbox-controls { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); padding: 0.5rem 1rem; border-radius: 30px; color: #ffffff; }
  .lightbox-btn { background: transparent; border: none; color: #ffffff; cursor: pointer; display: flex; align-items: center; }

  /* --- TYPING & WAVE --- */
  .typing-dots { display: flex; align-items: center; gap: 4px; padding: 0.6rem 0.9rem; }
  .typing-dots span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; } .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
  .wave-bars { display: flex; align-items: center; gap: 3px; height: 18px; margin-right: 4px; }
  .wave-bar { width: 3px; height: 100%; background: #ef4444; border-radius: 2px; animation: wavePulse 1s infinite ease-in-out alternate; }
  .wave-bar:nth-child(2) { animation-delay: 0.2s; } .wave-bar:nth-child(3) { animation-delay: 0.4s; }

  .a2img { max-width: 100%; height: auto; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); cursor: pointer; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.35rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* --- BOTTOM BAR --- */
  .bottom-container {
    background: var(--bg-card); border-top: 1px solid var(--border); max-width: 840px; width: 100%; margin: 0 auto;
    border-top-left-radius: 20px; border-top-right-radius: 20px; flex-shrink: 0;
    padding-bottom: max(0.75rem, env(safe-area-inset-bottom, 0px));
    padding-left: max(0.5rem, env(safe-area-inset-left, 0px));
    padding-right: max(0.5rem, env(safe-area-inset-right, 0px));
  }
  #examples { display: flex; gap: 0.5rem; padding: 0.75rem 1rem 0.35rem; overflow-x: auto; -webkit-overflow-scrolling: touch; justify-content: flex-start; scrollbar-width: none; }
  #examples::-webkit-scrollbar { display: none; }
  .pill { background: var(--bg-main); color: var(--text-secondary); border: 1px solid var(--border); padding: 0.55rem 0.95rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; min-height: 40px; }
  .pill:active { background: var(--accent-glow); color: var(--accent-dark); border-color: var(--accent-light); transform: scale(0.96); }

  form { display: flex; gap: 0.6rem; padding: 0.6rem 1rem 0.6rem; align-items: center; }
  .input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
  input { width: 100%; padding: 0.85rem 5.2rem 0.85rem 1.1rem; border: 1.5px solid var(--border); border-radius: 24px; font-size: 16px; font-family: inherit; outline: none; transition: all 0.2s ease; background: var(--bg-main); color: var(--text-primary); min-height: 48px; }
  input:focus { border-color: var(--accent); background: var(--bg-card); box-shadow: 0 0 0 4px var(--accent-glow); }
  .input-actions-right { position: absolute; right: 6px; display: flex; align-items: center; gap: 2px; }
  .input-icon-btn { background: transparent; border: none; color: var(--text-muted); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  button#send-btn { width: 48px; height: 48px; min-width: 48px; min-height: 48px; border: none; border-radius: 50%; background: linear-gradient(135deg, #059669 0%, #10b981 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-lg); flex-shrink: 0; }

  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(15, 23, 42, 0.9); color: #ffffff; padding: 0.6rem 1.2rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 3000; display: flex; align-items: center; gap: 0.4rem; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Printable Routine Styles */
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000000; background: #ffffff; padding: 2rem; }
  }
</style>
</head>
<body>

<!-- AUTH OVERLAY MODAL -->
<div id="auth-overlay" class="modal-overlay">
  <div class="modal-card" style="max-width:420px;text-align:center">
    <div class="auth-logo">⚡</div>
    <h2 class="auth-title">NovaSmart Fitness</h2>
    <p class="auth-subtitle">Sign in to sync your AI workouts & session history</p>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login">Sign In</button>
      <button type="button" class="auth-tab" id="tab-signup">Register</button>
    </div>
    <form class="auth-form" id="auth-form">
      <div id="auth-error-msg" style="display:none;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:0.65rem 0.85rem;border-radius:12px;font-size:0.8rem;font-weight:600"></div>
      <div class="input-field-group">
        <label for="auth-email">Email or Username</label>
        <input type="text" id="auth-email" class="auth-input" placeholder="user@novasmart.ai" required value="alex.runner@example.com">
      </div>
      <div class="input-field-group">
        <label for="auth-pass">Password</label>
        <input type="password" id="auth-pass" class="auth-input" placeholder="••••••••" required value="fitness2026">
      </div>
      <button type="submit" class="auth-submit-btn" id="auth-btn-text">Sign In to Account</button>
    </form>
    <div class="guest-divider">OR</div>
    <button type="button" class="guest-btn" id="guest-btn">⚡ Continue as Guest / Demo Mode</button>
  </div>
</div>

<!-- ATHLETE PROFILE & SETTINGS MODAL -->
<div id="settings-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3 class="modal-title"><span class="material-symbols-outlined">tune</span> Athlete Profile Settings</h3>
      <button class="close-icon-btn" id="settings-close-btn"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="settings-form" style="display:flex;flex-direction:column;gap:1rem;padding:0">

<script>
const log = document.getElementById("log");

// Auth & Modals

const historyModal = document.getElementById("history-modal");

// Lightbox

const lightboxSpeedBtn = document.getElementById("lightbox-speed-btn");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function showToast(msg) {

}

// --- Water Tracker State ---
let waterIntakeLiters = 1.75;
function updateWaterUI() {

}

// --- Athlete Profile Preferences ---
let userProfile = {
  goal: "HIIT Endurance & Cardio",
  equip: "Full Commercial Gym Access",
  diet: "High Protein Balanced",
  ttsRate: "1.0",
  injury: "None"
};

function loadSettings() {
  const saved = localStorage.getItem("nova_profile");
  if (saved) { try { userProfile = JSON.parse(saved); } catch(e) {} }
  document.getElementById("set-goal").value = userProfile.goal;
  document.getElementById("set-equip").value = userProfile.equip;

btnOpenLog.addEventListener("click", () => { renderHistory(); historyModal.classList.remove("hidden"); });
btnWaterTrack.addEventListener("click", () => { submitPrompt("Show Hydration Tracker card"); });
historyCloseBtn.addEventListener("click", () => historyModal.classList.add("hidden"));

// --- Auth Handling ---
let isRegisterMode = false;
function showAuthError(msg) {
  if (msg) { authErrorMsg.textContent = msg; authErrorMsg.style.display = "block"; }
  else { authErrorMsg.style.display = "none"; }
}

function checkAuth() {
  const savedUser = localStorage.getItem("nova_user");
  if (savedUser) { userNameTxt.textContent = savedUser.split("@")[0]; authOverlay.classList.add("hidden"); }
  else { authOverlay.classList.remove("hidden"); }
}

tabLogin.addEventListener("click", () => { isRegisterMode = false; tabLogin.classList.add("active"); tabSignup.classList.remove("active"); authBtnText.textContent = "Sign In to Account"; showAuthError(null); });
tabSignup.addEventListener("click", () => { isRegisterMode = true; tabSignup.classList.add("active"); tabLogin.classList.remove("active"); authBtnText.textContent = "Create Free Account"; showAuthError(null); });

authForm.addEventListener("submit", async (ev) => {
  ev.preventDefault(); showAuthError(null);
  const emailVal = authEmail.value.trim();
  const passVal = document.getElementById("auth-pass").value.trim();
  if (!emailVal || !passVal) { showAuthError("Please fill in both email and password."); return; }

  const endpoint = isRegisterMode ? "/auth/register" : "/auth/login";
  authBtnText.textContent = "Verifying...";
  try {
    const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: emailVal, password: passVal }) });
    const data = await res.json();
    if (!res.ok || data.error) { showAuthError(data.error || "Authentication failed."); return; }

    const userName = data.user ? data.user.name : emailVal.split("@")[0];
    localStorage.setItem("nova_user", emailVal);
    userNameTxt.textContent = userName;
    authOverlay.classList.add("hidden");
    showToast(isRegisterMode ? "Account registered & signed in!" : "Welcome back, " + userName + "!");
  } catch (err) { showAuthError("Network error contacting server."); }
  finally { authBtnText.textContent = isRegisterMode ? "Create Free Account" : "Sign In to Account"; }
});

guestBtn.addEventListener("click", () => {
  localStorage.setItem("nova_user", "Guest Athlete"); userNameTxt.textContent = "Guest"; authOverlay.classList.add("hidden"); showToast("Logged in as Guest");
});

logoutBtn.addEventListener("click", () => {
  localStorage.removeItem("nova_user"); userNameTxt.textContent = "Guest"; authOverlay.classList.remove("hidden");
});

// --- Theme Controller ---
function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved === "dark") { document.documentElement.setAttribute("data-theme", "dark"); themeBtn.querySelector(".material-symbols-outlined").textContent = "light_mode"; }
}
themeBtn.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  if (current === "dark") { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme", "light"); themeBtn.querySelector(".material-symbols-outlined").textContent = "dark_mode"; }
  else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("theme", "dark"); themeBtn.querySelector(".material-symbols-outlined").textContent = "light_mode"; }
});

// --- Lightbox Modal ---
let activeMediaElement = null;
let currentSpeedIndex = 1;
const speeds = [0.5, 1.0, 1.25, 1.5, 2.0];
function openLightbox(element) {
  lightboxContainer.innerHTML = "";
  const clone = element.cloneNode(true);
  clone.style.maxWidth = "85vw"; clone.style.maxHeight = "75vh";
  if (clone.tagName === "VIDEO") clone.controls = true;
  lightboxContainer.appendChild(clone);
  activeMediaElement = clone;
  lightboxModal.classList.add("active");
}
lightboxCloseBtn.addEventListener("click", () => lightboxModal.classList.remove("active"));
lightboxSpeedBtn.addEventListener("click", () => {
  if (activeMediaElement && activeMediaElement.tagName === "VIDEO") {
    currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
    activeMediaElement.playbackRate = speeds[currentSpeedIndex];
    lightboxSpeedBtn.textContent = speeds[currentSpeedIndex] + "x Speed";
  }
});
lightboxDownloadBtn.addEventListener("click", () => {
  if (activeMediaElement && activeMediaElement.src) {
    const a = document.createElement("a"); a.href = activeMediaElement.src; a.download = "fitness-media"; a.target = "_blank"; a.click();
  }
});

// --- Welcome Hero Card ---
function renderWelcomeHero() {
  log.innerHTML = "";
  const hero = el("div", "welcome-hero");
  hero.innerHTML = `
    <div class="welcome-icon">⚡</div>
    <h2>Welcome to NovaSmart Fitness!</h2>
    <p>Your multi-tool AI health coach powered by Gemini & Vertex AI Memory Bank.</p>
    <div class="welcome-grid">
      <div class="feature-card" data-prompt="Suggest a 30-min beginner HIIT workout">
        <div class="feature-card-title">🏃 Workouts & Routines</div>
        <div class="feature-card-desc">Custom training plans tailored to your goals.</div>
      </div>
      <div class="feature-card" data-prompt="Show Body Mass Index & Fat % card">
        <div class="feature-card-title">📐 BMI & Body Fat</div>
        <div class="feature-card-desc">Calculate body composition and BMR.</div>
      </div>
      <div class="feature-card" data-prompt="Show Exercise Substitution Finder card">
        <div class="feature-card-title">🔄 Exercise Substitutes</div>
        <div class="feature-card-desc">Find equipment or injury alternatives.</div>
      </div>
      <div class="feature-card" data-prompt="Show Hydration Tracker card">
        <div class="feature-card-title">💧 Hydration Tracker</div>
        <div class="feature-card-desc">Track daily fluid intake and targets.</div>
      </div>
    </div>
  `;
  log.appendChild(hero);
  hero.querySelectorAll("[data-prompt]").forEach(card => card.addEventListener("click", () => submitPrompt(card.dataset.prompt)));
}
function removeWelcomeHero() { const hero = log.querySelector(".welcome-hero"); if (hero) hero.remove(); }
clearBtn.addEventListener("click", () => renderWelcomeHero());

// --- Speech Recognition & TTS ---
if ("SpeechRecognition" in window || "webkitSpeechRecognition" in window) {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRec();
  recognition.onstart = () => { micBtn.innerHTML = `<div class="wave-bars"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>`; };
  recognition.onend = () => { micBtn.innerHTML = `<span class="material-symbols-outlined">mic</span>`; };
  recognition.onresult = (ev) => { input.value = ev.results[0][0].transcript; input.focus(); };
  micBtn.addEventListener("click", () => { if (micBtn.querySelector(".wave-bars")) recognition.stop(); else recognition.start(); });
} else { micBtn.style.display = "none"; }

attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { if (fileInput.files.length) { showToast("Attached image: " + fileInput.files[0].name); input.value += " [Image attached: " + fileInput.files[0].name + "]"; } });

// --- Dialogue Renderer & Action Buttons ---
function bubble(who) {
  removeWelcomeHero();
  const row = el("div", "msg-row " + who);
  const avatar = el("div", "avatar", who === "agent" ? "⚡" : "👤");
  const content = el("div", "msg-content");
  const b = el("div", "bubble");
  content.appendChild(b);

  if (who === "agent") {
    const actions = el("div", "msg-actions");
    const copyBtn = el("button", "msg-action-btn", "Copy");
    copyBtn.innerHTML = `<span class="material-symbols-outlined">content_copy</span> Copy`;
    copyBtn.addEventListener("click", () => { navigator.clipboard.writeText(b.innerText); showToast("Copied to clipboard!"); });

    const speakBtn = el("button", "msg-action-btn", "Read");
    speakBtn.innerHTML = `<span class="material-symbols-outlined">volume_up</span> Read`;
    speakBtn.addEventListener("click", () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(b.innerText);
        utter.rate = parseFloat(userProfile.ttsRate || "1.0");
        window.speechSynthesis.speak(utter);
        showToast("Reading aloud (" + utter.rate + "x speed)...");
      }
    });

    const printBtn = el("button", "msg-action-btn", "Print PDF");
    printBtn.innerHTML = `<span class="material-symbols-outlined">print</span> Print Sheet`;
    printBtn.addEventListener("click", () => {
      const printArea = document.getElementById("print-area");
      printArea.innerHTML = `<h2>NovaSmart Fitness Coach - Workout Routine</h2><div>${b.innerHTML}</div>`;
      window.print();
    });

    actions.appendChild(copyBtn); actions.appendChild(speakBtn); actions.appendChild(printBtn);
    content.appendChild(actions);
  }

  row.appendChild(avatar); row.appendChild(content); log.appendChild(row); log.scrollTop = log.scrollHeight;
  return b;
}

function showTypingIndicator() { const b = bubble("agent"); b.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`; return b; }

// --- WATER INTAKE TRACKER CARD ---
function renderWaterCard(container) {
  const card = el("div", "water-card");
  card.innerHTML = `
    <div style="font-weight:800;font-size:1rem;color:#3b82f6;display:flex;align-items:center;gap:0.4rem">💧 Daily Hydration Tracker</div>
    <div style="font-size:1.5rem;font-weight:800;color:var(--text-primary);text-align:center" id="wcard-disp">${waterIntakeLiters.toFixed(2)} L / 3.00 L</div>
    <div class="water-progress-bg"><div class="water-progress-fill" id="wcard-bar" style="width:${Math.min(100, (waterIntakeLiters/3.0)*100)}%"></div></div>
    <div style="display:flex;gap:0.5rem;justify-content:center">
      <button type="button" class="timer-btn" id="wbtn-250">+250 ml</button>
      <button type="button" class="timer-btn" id="wbtn-500">+500 ml</button>
      <button type="button" class="timer-btn" id="wbtn-reset" style="background:var(--border);color:var(--text-primary)">Reset</button>
    </div>
  `;
  container.appendChild(card);
  const disp = card.querySelector("#wcard-disp"); const bar = card.querySelector("#wcard-bar");
  card.querySelector("#wbtn-250").addEventListener("click", () => { waterIntakeLiters += 0.25; update(); });
  card.querySelector("#wbtn-500").addEventListener("click", () => { waterIntakeLiters += 0.50; update(); });
  card.querySelector("#wbtn-reset").addEventListener("click", () => { waterIntakeLiters = 0; update(); });
  function update() {
    disp.textContent = `${waterIntakeLiters.toFixed(2)} L / 3.00 L`;
    bar.style.width = `${Math.min(100, (waterIntakeLiters/3.0)*100)}%`;
    updateWaterUI(); showToast("Hydration logged!");
  }
}

// --- BMI & BODY FAT CALCULATOR CARD ---
function renderBMICard(container) {
  const card = el("div", "bmi-card");
  card.innerHTML = `
    <div style="font-weight:800;font-size:1rem;color:var(--accent);display:flex;align-items:center;gap:0.4rem">📐 BMI & Body Fat % Calculator</div>
    <div class="macro-slider-group"><div class="macro-slider-header"><span>Weight (kg)</span><span id="bmival-weight">72</span></div><input type="range" min="40" max="150" value="72" class="macro-slider" id="bmislider-weight"></div>
    <div class="macro-slider-group"><div class="macro-slider-header"><span>Height (cm)</span><span id="bmival-height">176</span></div><input type="range" min="140" max="210" value="176" class="macro-slider" id="bmislider-height"></div>
    <div class="macro-results">
      <div><div class="macro-box-val" id="bmi-score">23.2</div><div class="macro-box-lbl">BMI Score</div></div>
      <div><div class="macro-box-val" id="bmi-status" style="color:#10b981">Normal</div><div class="macro-box-lbl">Category</div></div>
      <div><div class="macro-box-val" id="bmi-bmr">1,680</div><div class="macro-box-lbl">BMR (kcal)</div></div>
    </div>
    <button type="button" class="timer-btn" id="bmi-send-btn" style="width:100%;justify-content:center;margin-top:0.4rem">💬 Send Body Composition to Coach</button>
  `;
  container.appendChild(card);
  const wSlider = card.querySelector("#bmislider-weight"); const hSlider = card.querySelector("#bmislider-height");
  const wVal = card.querySelector("#bmival-weight"); const hVal = card.querySelector("#bmival-height");
  const scoreVal = card.querySelector("#bmi-score"); const statusVal = card.querySelector("#bmi-status"); const bmrVal = card.querySelector("#bmi-bmr");

  function calc() {
    const w = parseInt(wSlider.value); const h = parseInt(hSlider.value);
    wVal.textContent = w; hVal.textContent = h;
    const bmi = (w / ((h/100) * (h/100))).toFixed(1);
    scoreVal.textContent = bmi;
    const bmr = Math.round(10 * w + 6.25 * h - 5 * 30 + 5);
    bmrVal.textContent = bmr.toLocaleString();
    if (bmi < 18.5) { statusVal.textContent = "Underweight"; statusVal.style.color = "#3b82f6"; }
    else if (bmi < 25) { statusVal.textContent = "Normal / Fit"; statusVal.style.color = "#10b981"; }
    else if (bmi < 30) { statusVal.textContent = "Overweight"; statusVal.style.color = "#f59e0b"; }
    else { statusVal.textContent = "High Risk"; statusVal.style.color = "#ef4444"; }
  }
  wSlider.addEventListener("input", calc); hSlider.addEventListener("input", calc); calc();
  card.querySelector("#bmi-send-btn").addEventListener("click", () => {
    submitPrompt(`My BMI score is ${scoreVal.textContent} (${statusVal.textContent}) and BMR is ${bmrVal.textContent} kcal. Recommend a body composition optimization routine.`);
  });
}

    <div class="zone-spectrum" id="zone-list"></div>

function renderTimerWidget(container, defaultSeconds = 60) {
  let timerVal = defaultSeconds;
  let timerInterval = null;
  const widget = el("div", "timer-widget");
  widget.innerHTML = `
    <div style="font-weight:700;font-size:0.85rem;color:var(--accent);display:flex;align-items:center;gap:0.35rem">⏱️ Rest & Exercise Interval Timer</div>
    <div class="timer-display" id="tdisp">01:00</div>
    <div class="timer-controls">
      <button type="button" class="timer-btn" id="tstart">▶ Start</button>
      <button type="button" class="timer-btn" id="tpause">⏸ Pause</button>
      <button type="button" class="timer-btn" id="treset" style="background:var(--border);color:var(--text-primary)">🔄 Reset</button>
    </div>
  `;
  container.appendChild(widget);

  const display = widget.querySelector("#tdisp");
  const startBtn = widget.querySelector("#tstart");
  const pauseBtn = widget.querySelector("#tpause");
  const resetBtn = widget.querySelector("#treset");

  function fmt(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDisplay() { display.textContent = fmt(timerVal); }

  startBtn.addEventListener("click", () => {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      if (timerVal > 0) {
        timerVal--;
        updateDisplay();
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
        showToast("⏰ Interval timer complete!");
      }
    }, 1000);
  });

  pauseBtn.addEventListener("click", () => {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  });

  resetBtn.addEventListener("click", () => {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerVal = defaultSeconds;
    updateDisplay();
  });

  updateDisplay();
}

function renderReply(b, parts) {
  b.textContent = "";
  const extractedLines = [];

  parts.forEach(p => {
    if (!p) return;
    if (p.kind === "text" || (!p.kind && p.text)) {
      if (p.text) extractedLines.push(p.text);
    } else if (p.kind === "a2ui" && p.data) {
      const data = p.data;
      if (data.surfaceUpdate && Array.isArray(data.surfaceUpdate.components)) {
        data.surfaceUpdate.components.forEach(compObj => {
          const comp = compObj.component || {};
          if (comp.Text && comp.Text.text && comp.Text.text.literalString) {
            extractedLines.push(comp.Text.text.literalString);
          }
        });
      }
    }
  });

  const textStr = extractedLines.join("\n").trim();
  if (textStr) {
    b.appendChild(el("div", null, textStr));
    const urlMatches = textStr.match(/https?:\/\/[^\s"]+\.(mp4|webm|png|jpg|jpeg)/gi);
    if (urlMatches) {
      urlMatches.forEach(url => {
        if (url.endsWith(".mp4") || url.endsWith(".webm")) {
          const video = el("video", "a2img"); video.src = url; video.controls = true; video.addEventListener("click", () => openLightbox(video)); b.appendChild(video);
        } else {
          const img = el("img", "a2img"); img.src = url; img.addEventListener("click", () => openLightbox(img)); b.appendChild(img);
        }
      });
    }
    if (/workout|hiit|routine|exercise|seconds|reps/i.test(textStr)) { renderTimerWidget(b, 60); }
  } else {
    b.textContent = "Coach replied, but no displayable text was returned.";
  }
  log.scrollTop = log.scrollHeight;
}

function submitPrompt(text) {
  if (!text) return;
  if (text.includes("Hydration Tracker")) { removeWelcomeHero(); renderWaterCard(bubble("agent")); return; }
  if (text.includes("BMI & Body Fat")) { removeWelcomeHero(); renderBMICard(bubble("agent")); return; }
  if (text.includes("Exercise Substitution")) { removeWelcomeHero(); renderSubCard(bubble("agent")); return; }
  if (text.includes("Heart Rate")) { removeWelcomeHero(); renderHRZoneCard(bubble("agent")); return; }

  const fullPrompt = `[Athlete Context: Goal: ${userProfile.goal}, Equip: ${userProfile.equip}, Health: ${userProfile.injury}] ${text}`;
  input.value = text;
  if (typeof form.requestSubmit === "function") form.requestSubmit();
  else form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = showTypingIndicator();

  const fullPrompt = `[Athlete Context: Goal: ${userProfile.goal}, Equip: ${userProfile.equip}, Health: ${userProfile.injury}] ${text}`;
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: fullPrompt }) });
    const raw = await res.text();
    let data; try { data = JSON.parse(raw); } catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}).`); }
    renderReply(b, data.parts || []);
  } catch (e) { b.textContent = "Error: " + e.message; }
});

document.querySelectorAll(".pill").forEach(p => p.addEventListener("click", () => submitPrompt(p.dataset.prompt)));

const headerBrandLogo = document.getElementById("header-brand-logo");
if (headerBrandLogo) {
  headerBrandLogo.addEventListener("click", () => window.location.reload());
}

checkAuth(); initTheme(); renderWelcomeHero(); updateWaterUI();
</script>
