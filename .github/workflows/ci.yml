name: NovaSmart Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r frontend/requirements.txt pytest

    - name: Run Backend Security Test Suite
      env:
        AGENT_ENGINE_RESOURCE_NAME: "projects/943429364849/locations/us-east1/reasoningEngines/8579632168047738880"
      run: |
        python -m unittest frontend/tests/test_backend.py
